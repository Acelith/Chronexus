# Forgejo Actions on github.com (M30). Forgejo prefers this folder over .github/workflows.
# Needs a runner with the `docker` label. Jobs run in the project's CI image (the
# scripts/qa/linux/Dockerfile image published in the Forgejo registry), so results match a
# local run of scripts/qa/run-all.sh.
name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  CARGO_TARGET_DIR: /tmp/target
jobs:
  checks:
    runs-on: docker
    container:
      image: ghcr.io/acelith/chronexus-ci:2026.10.27
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm i18n:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:automation
      - run: python3 -m unittest discover -s scripts/release -p test_updater_manifest.py
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  real-app:
    # The real debug app under Xvfb: main flows through Tauri IPC, then a .deb package.
    runs-on: docker
    needs: checks
    container:
      image: ghcr.io/acelith/chronexus-ci:2026.10.27
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: sh scripts/qa/ipc/run-linux.sh
      - run: pnpm build
      - run: >-
          pnpm tauri build --bundles deb
          --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: chronexus-linux-deb
          path: /tmp/target/release/bundle/deb/*.deb
          retention-days: 14
