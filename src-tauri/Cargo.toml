[package]
name = "chronexus"
version = "0.10.1"
description = "Your offline RPG campaign journal"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "chronexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
tauri-plugin-dialog = "2.8.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
getrandom = "0.4.3"

reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["macros", "sync", "time", "fs"] }

tokio-util = { version = "0.7", features = ["io", "rt"] }
# The `zip` feature only handles legacy Tauri v1 compressed bundles (.msi.zip,
# .exe.zip, .AppImage.tar.gz), which Chronexus never publishes, and pulls a zip 4.x
# with RUSTSEC-2026-0367/0368/0369. macOS .app.tar.gz updates do not need it.
tauri-plugin-updater = { version = "~2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Free-space check before the explicit M22 runtime/model setup.
fs4 = "1.1"
# Inert HTML5 parsing of public Wikidot pages; no scripting or network of its own.
scraper = { version = "0.29", default-features = false }

# Large GGUF checksums should stay responsive in development builds too.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
