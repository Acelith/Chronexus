[package]
name = "nodex"
version = "0.1.0"
description = "Diario personale di campagne GDR, offline"
edition = "2021"
license = "MIT"

[lib]
name = "nodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
