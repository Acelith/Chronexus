[package]
name = "chronexus"
version = "0.2.0"
description = "Diario personale di campagne GDR, offline"
edition = "2021"
license = "MIT"

[lib]
name = "chronexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10.9"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
tauri-plugin-dialog = "2.8.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
getrandom = "0.4.3"

reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "sync", "time", "fs"] }

tokio-util = { version = "0.7", features = ["io"] }

# Large GGUF checksums should stay responsive in development builds too.
[profile.dev.package.sha2]
opt-level = 3
